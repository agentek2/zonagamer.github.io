<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículos seleccionados | Zona Gamer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
    <style>
        .sale-page {
            min-height: 100vh;
            padding: 36px clamp(16px, 6vw, 80px);
            background: #f4f5f6;
            font-family: Arial, sans-serif;
        }
        
        .sale-page h1 {
            margin: 0 0 24px;
            color: #17231f;
            font-size: 30px;
        }
        
        .sale-list {
            max-width: 1050px;
            margin: auto;
        }
        
        .sale-item {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr) auto;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
            padding: 16px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000012;
        }
        
        .sale-item img {
            width: 110px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }
        
        .sale-item-details h2 {
            margin: 0 0 8px;
            font-size: 19px;
        }
        
        .sale-item-details p {
            margin: 5px 0;
            color: #444;
        }
        
        .sale-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }
        
        .sale-item-actions button,
        #clearCart {
            padding: 9px 14px;
            border: 0;
            border-radius: 7px;
            color: #fff;
            background: #c62828;
            cursor: pointer;
        }
        
        .sale-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            max-width: 1050px;
            margin: 24px auto;
            padding: 18px;
            background: #fff;
            border-radius: 12px;
            font-size: 19px;
        }
        
        #clearCart {
            background: #333;
        }
        
        #saleEmpty {
            max-width: 1050px;
            margin: auto;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
        }
        
        .sale-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #145d4a;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .sale-item {
                grid-template-columns: 76px minmax(0, 1fr);
                gap: 12px;
                padding: 12px;
            }
            .sale-item img {
                width: 76px;
                height: 76px;
            }
            .sale-item-actions {
                grid-column: 2;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .sale-summary {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="sale-page">
        <a class="sale-back" href="pidelo.html">← Volver a la tienda</a>
        <h1>Artículos seleccionados</h1>
        <section id="saleItems" class="sale-list" aria-live="polite"></section>
        <p id="saleEmpty" hidden>No has seleccionado artículos todavía.</p>
        <div class="sale-summary">
            <strong>Total a pagar: <span id="saleTotal">S/ 0.00</span></strong>
            <button id="clearCart" type="button">Vaciar selección</button>
        </div>
    </main>
    <script src="carrito.js"></script>
</body>

</html>
